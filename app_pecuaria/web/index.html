<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app_pecuaria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BovControl Pro</title>
  <link rel="manifest" href="manifest.json">
  <style>
      :root {
          --primary-green: #1b4d3e;
          --bg-color: #f7f9f6;
      }
      
      /* Modal Customizado (Bordas Redondas e Sem Contorno) */
      #installModal {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5);
          justify-content: center;
          align-items: center;
          z-index: 999999;
      }

      .modal-content {
          background-color: #ffffff;
          padding: 30px;
          width: 90%;
          max-width: 320px;
          border-radius: 24px;
          border: none;
          box-shadow: 0 10px 25px rgba(0,0,0,0.15);
          text-align: center;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .modal-content h3 {
          color: var(--primary-green);
          margin-top: 0;
          margin-bottom: 10px;
      }

      .modal-content p {
          font-size: 13px;
          color: #556b60;
          margin-bottom: 20px;
      }

      .modal-actions {
          display: flex;
          gap: 10px;
      }

      .modal-btn {
          flex: 1;
          padding: 10px;
          border-radius: 12px;
          font-weight: 600;
          cursor: pointer;
          border: none;
          font-size: 14px;
      }

      .btn-confirm {
          background-color: var(--primary-green);
          color: white;
      }

      .btn-cancel {
          background-color: #e2e8e4;
          color: #4a5d54;
      }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- HTML do Modal -->
  <div id="installModal">
      <div class="modal-content">
          <h3 id="installTitle">Instalar AgroBov</h3>
          <p id="installDescription">Adicione o app à sua tela inicial para acesso rápido e funcionamento offline.</p>
          <div class="modal-actions">
              <button class="modal-btn btn-cancel" id="closeModalBtn">Agora não</button>
              <button class="modal-btn btn-confirm" id="confirmInstallBtn">Instalar</button>
          </div>
      </div>
  </div>

  <!-- Lógica do Modal -->
  <script>
      let deferredPrompt;
      const installModal = document.getElementById('installModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const confirmInstallBtn = document.getElementById('confirmInstallBtn');
      const installTitle = document.getElementById('installTitle');
      const installDescription = document.getElementById('installDescription');
      
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      // Se for iOS e não estiver instalado, mostra o modal instruindo
      if (isIOS && !isStandalone) {
          installTitle.textContent = 'Adicionar ao iPhone';
          installDescription.textContent = 'No Safari, toque em Compartilhar, escolha "Adicionar à Tela de Início" e confirme em Adicionar.';
          confirmInstallBtn.textContent = 'Entendi';
          // Delay sutil para não abrir abruptamente antes da tela renderizar
          setTimeout(() => { installModal.style.display = 'flex'; }, 3000);
      }

      // No Android/Chrome, intercepta o prompt nativo e mostra nosso modal
      window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          // Aguarda um pouco e exibe o modal
          setTimeout(() => { installModal.style.display = 'flex'; }, 2000);
      });

      window.addEventListener('appinstalled', () => {
          deferredPrompt = null;
          installModal.style.display = 'none';
      });

      closeModalBtn.addEventListener('click', () => {
          installModal.style.display = 'none';
      });

      confirmInstallBtn.addEventListener('click', async () => {
          installModal.style.display = 'none';
          if (isIOS) return; // No iOS é só manual via Safari
          
          if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') {
                  console.log('PWA instalado');
              }
              deferredPrompt = null;
          }
      });
  </script>
</body>
</html>
